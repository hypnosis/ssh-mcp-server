name: Feature request
description: Something the server should be able to do and cannot
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: The task on the server, not the API you have in mind for it.
      placeholder: I wanted to know which of twelve machines had a full disk, without asking each one in turn.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Which tools you chain, or why none of them fit.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: A new tool, a parameter on an existing one, or just the outcome — a shape is welcome but not required.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not something `ssh_exec` already does with a plain command
        - label: It would not require renaming an existing tool or changing the profile format
