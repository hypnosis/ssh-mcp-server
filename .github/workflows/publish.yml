name: Publish to NPM

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      # Checked here rather than at the publish step, which is the last one: a token
      # without publish rights is answered by the registry with 404 Not Found on the
      # package itself, which reads as "the package does not exist" and sends you
      # looking in the wrong place — after the build and the tests have already run.
      - name: Verify npm credentials
        run: |
          if ! WHOAMI=$(npm whoami 2>&1); then
            echo "::error::npm rejected NPM_TOKEN: $WHOAMI"
            echo "The token is missing, expired, or has no publish rights on this scope."
            exit 1
          fi
          echo "Publishing as: $WHOAMI"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (fast, no Docker)
        run: npm run test:unit
      
      - name: Build
        run: npm run build
      
      - name: Extract version from tag
        id: version
        run: |
          # Support both tag formats: vX.Y.Z and X.Y.Z
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Published version: $VERSION"
      
      - name: Verify version matches package.json
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          PACKAGE_ENTRY_VERSION=$(node -p "require('./server.json').packages[0].version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          # server.json carries the version twice — the server and the npm package it
          # points at — and the registry rejects the pair when either one drifts.
          if [ "$TAG_VERSION" != "$SERVER_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_ENTRY_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match server.json ($SERVER_VERSION / $PACKAGE_ENTRY_VERSION)"
            exit 1
          fi
          echo "Version match confirmed: $TAG_VERSION"
      
      - name: Check if version already published
        id: check_version
        run: |
          if npm view @hypnosis/ssh-mcp-server@${{ steps.version.outputs.version }} version >/dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.version.outputs.version }} already published, skipping"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.version.outputs.version }} not found, will publish"
          fi
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      # --provenance signs the package against this workflow run, so npm can show
      # which commit and which build produced it. Needs the id-token permission
      # declared above, and only works when publishing from CI.
      - name: Publish to NPM
        if: steps.check_version.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      # The registry stores metadata only: it reads mcpName straight from the package
      # that npm now serves, so this has to come after the publish above. The identity
      # is the same OIDC token that signs the provenance — nothing to store as a secret.
      # Runs unconditionally: when npm went through and the registry did not, re-running
      # the tag is the repair, and a duplicate listing fails loudly rather than silently.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Skip publish (already exists)
        if: steps.check_version.outputs.already_published == 'true'
        run: echo "✅ Version ${{ steps.version.outputs.version }} already published, skipping"
      
      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ steps.version.outputs.version }}" \
            --notes "## Changes in ${{ steps.version.outputs.version }}
          
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          
          ### Installation
          \`\`\`bash
          npm install -g @hypnosis/ssh-mcp-server
          \`\`\`
          
          Or use with npx:
          \`\`\`bash
          npx @hypnosis/ssh-mcp-server
          \`\`\`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
