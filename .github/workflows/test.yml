name: Unit Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci

      # Отдельным шагом, хотя tsc уже отработал внутри npm ci через prepare:
      # там ошибка типов выглядит как сбой установки зависимостей.
      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:unit
