name: Unit Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci

      # A separate step, even though prepare already ran tsc during npm ci:
      # in there a type error looks like a failed dependency install.
      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:unit
